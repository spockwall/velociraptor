# Kalshi orderbook configuration (visualizer example + kalshi_recorder)
# Run with: cargo run --example kalshi_orderbook -- --config configs/dev/kalshi.yaml
#      or:  cargo run --bin kalshi_recorder -- --config configs/dev/kalshi.yaml

server:
  render_interval: 300

storage:
  enabled: true
  base_path: "./data/kalshi"
  depth: 8 # depth levels to store (bids + asks)
  flush_interval: 500 # ms between BufWriter flushes
  rotation: "none" # "daily" | "none"
  zstd_level: 3 # 0 = disabled, 1–22 = zstd compression level (3 is a good default)

logging:
  level: "info"          # env-filter string, e.g. "info,libs=debug"
  json: false            # set true to emit JSON-formatted records
  dir: "./logs"          # files: {dir}/kalshi_recorder/{YYYY-MM-DD}.log and …/{YYYY-MM-DD}.error.log

# Rolling 15-minute markets.
# series — Kalshi series ticker (the part before the date stamp).
# label  — short name shown in the panel title (optional, defaults to series).
#
# Ticker format: {series}-{YYMONDDHHММ (Eastern time)}-15
# Example:       KXBTC15M-26APR130415-15  (closes 08:15 UTC = 04:15 EDT)

kalshi:
  market:
    - enable: true
      series: "KXBTC15M"
      interval_secs: 900
    - enable: true
      series: "KXETH15M"
      interval_secs: 900
